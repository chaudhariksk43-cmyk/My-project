name: Apex V61 Live Trading Bot

on:
  workflow_dispatch: # Manual trigger કરવા માટે
  schedule:
    # રોજ સવારે 9:00 AM UTC (આશરે 2:30 PM IST) કે market hours મુજબ run કરવા માટે Cron job
    - cron: '30 3 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests smartapi-python pyotp logzero

    - name: Run Apex Trading Bot
      env:
        ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      run: |
        python 28.py
