name: Run Programs

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run First Program
        run: python "apex plux mechanical.py"

      - name: Run Second Program
        run: python "hsshshsjjsbshzhzhzh.py"
        
